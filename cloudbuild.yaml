# Build de l'image sur Cloud Build (amd64 natif), poussée dans Artifact Registry.
# Usage : gcloud builds submit --config cloudbuild.yaml --substitutions _IMAGE=<image:tag>
# (voir README, section Déployer). Toujours un tag explicite.
steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - '--platform'
      - linux/amd64
      - '-t'
      - '$_IMAGE'
      - '.'
    id: build

images:
  - '$_IMAGE'

options:
  machineType: E2_HIGHCPU_8

timeout: 1800s
